# H2 stand-in for the real Postgres datasource: runs the real Flyway
# migrations, but against H2 rather than Postgres, so tests don't need
# DB_URL/DB_USER/DB_PASSWORD or a running database. Remove/replace once
# the project switches to Testcontainers with a real Postgres instance.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate

spring.security.oauth2.client.registration.github.client-id=test-id
spring.security.oauth2.client.registration.github.client-secret=test-secret
spring.security.oauth2.client.registration.github.scope=read:user,user:email

frontend.url=http://localhost:5173

azure.translator.endpoint=http://localhost
azure.translator.key=test-key
azure.translator.region=test-region

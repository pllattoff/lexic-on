# TEMPORARY: in-memory H2 stand-in for the real Postgres datasource, so tests
# don't need DB_URL/DB_USER/DB_PASSWORD or a running database.
# Remove/replace this once real Flyway migrations exist and/or the project
# switches to Testcontainers with a real Postgres instance for integration tests.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
